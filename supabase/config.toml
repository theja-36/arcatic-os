# Minimal Supabase CLI config; see `supabase init` for every option.
project_id = "arcatic-os"

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
file_size_limit = "500MiB"

[realtime]
enabled = true

# Local mail catcher (Mailpit): web UI on 54324, SMTP on 54325 for transactional-email tests
[inbucket]
enabled = true
port = 54324
smtp_port = 54325
